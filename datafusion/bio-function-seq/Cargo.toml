[package]
name = "datafusion-bio-function-seq"
version = "0.27.1"
description = "Sequence kernels (reverse complement, GC content, translation, read quality) and DataFusion scalar functions"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
datafusion.workspace = true
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64"] }

[dev-dependencies]
proptest = "1.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
