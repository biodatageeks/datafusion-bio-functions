class  = "blocked-future-work"
issue  = "biodatageeks/vepyr#TBD-3"
reason = "vepyr IMPLEMENTS this — `format_coords_ensembl` has the `(Some(s), Some(e)) if s > e => format!(\"{e}-{s}\")` arm — but nothing asserts it. The in-src unit test `format_coords_ensembl_supports_unknown_bounds` covers only 4 of the 6 Perl cases (rows 1, 2, 4, 5); the swap is untested. This is a one-line fix inside that test, and this branch is test-infrastructure-only with a hard no-`src/`-changes rule, so it is deferred rather than claimed. Reclassified from the `dev-test` port's `unit-port`, which pointed all six rows at a test that does not cover six cases."

