# ---------------------------------------------------------------------------
# numberify — Perl's pre-JSON coercion of stringified numbers inside arbitrarily
# nested structures, with an exempt-key map.
# ---------------------------------------------------------------------------

[[row]]
n      = 10
line   = 63
desc   = "numberify - arrayref: ['0','1'] coerces to the numbers [0, 1]"
class  = "architectural-no-analogue"
reason = "numberify exists because Perl scalars carry no type, so JSON output would otherwise quote every number. vepyr never has a string-typed intermediate to coerce: consequence data is built directly into typed Arrow arrays (Int64/Float64/Utf8) whose type is fixed by the schema contract in src/schema_contract.rs. There is no structure on which a numberifier could operate. Anti-goal in porting-tests/detailed_plans/Utils.md: do NOT build a generic numberify."

[[row]]
n      = 11
line   = 69
desc   = "numberify - hashref: {foo=>'0', bar=>'0.1'} coerces both values"
class  = "architectural-no-analogue"
reason = "Same as row 10 — no untyped nested structure exists in vepyr to coerce."

[[row]]
n      = 12
line   = 75
desc   = "numberify - mixed: coercion recurses into an arrayref nested in a hashref"
class  = "architectural-no-analogue"
reason = "Same as row 10; additionally, the recursion this pins down has no counterpart because vepyr's output is a flat Arrow record batch, not a nested Perl structure."

[[row]]
n      = 13
line   = 81
desc   = "numberify - float: '0.0001' coerces to a float rather than an integer"
class  = "architectural-no-analogue"
reason = "Same as row 10. The int-vs-float decision vepyr makes is made once, statically, by the Arrow field type; there is no runtime inference step to test."

[[row]]
n      = 14
line   = 87
desc   = "numberify - exponential: '1e3' coerces to 1000"
class  = "architectural-no-analogue"
reason = "Same as row 10. Exponential literals reach vepyr only inside cache values already parsed into f64 by the Parquet/Lance reader, so no string form survives to be coerced."

[[row]]
n      = 15
line   = 93
desc   = "numberify - exempt keys intact: 'id' and 'seq_region_name' stay strings"
class  = "architectural-no-analogue"
reason = "The exempt-key map is a workaround for numberify's own over-eagerness — identifiers that look numeric must be protected from it. vepyr declares those columns Utf8 in the schema, so the hazard the exemption guards against cannot arise and there is nothing to exempt."

