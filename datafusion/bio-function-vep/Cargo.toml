[package]
name = "datafusion-bio-function-vep"
version = "0.11.0"
description = "VEP (Variant Effect Predictor) annotation functions for Apache DataFusion"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
datafusion.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
futures.workspace = true
bytes = "1"
log.workspace = true
async-trait = "0.1.88"
chrono = "0.4"
libc = "0.2"
ahash = { version = "0.8.6", optional = true }
hashbrown = { version = "0.16.1", optional = true }
nohash-hasher = { version = "0.2.0", optional = true }
rapidhash = { version = "4.4.1", optional = true }
smallvec = { version = "1.15.1", optional = true }
flate2 = "1.1.0"
coitrees = "0.4.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
noodles-core = "0.16"
noodles-fasta = "0.49"
parquet = { version = "=58.0.0", features = ["arrow", "async", "zstd"] }
datafusion-bio-format-vcf ={ git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.8.8" }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.8.8", optional = true }
indicatif = "0.18.4"

[dev-dependencies]
mimalloc = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
datafusion-bio-function-ranges = { path = "../bio-function-ranges" }
noodles-vcf = { git = "https://github.com/biodatageeks/noodles.git", rev = "9b7b2c5b6531373918302d4c07410e583f1b5b5c" }
env_logger = "0.11"
tempfile = "3"
arrow-array = "58.0.0"
memmap2 = "0.9"

[[example]]
name = "vcf_batch_stats"
required-features = []

[[example]]
name = "build_parquet_variation_chrom"
required-features = ["parquet-cache", "cache-builder"]

[[example]]
name = "build_parquet_translation_sift_chrom"
required-features = ["parquet-cache", "cache-builder"]

[[example]]
name = "build_parquet_context_chrom"
required-features = ["parquet-cache", "cache-builder"]

[features]
default = ["parquet-cache"]
# Parquet cache read runtime (variation/SIFT point-lookups + context scans).
parquet-cache = [
    "dep:ahash",
    "dep:hashbrown",
    "dep:nohash-hasher",
    "dep:rapidhash",
    "dep:smallvec",
]
cache-builder = ["parquet-cache", "dep:datafusion-bio-format-ensembl-cache"]

# Regression tests that bake per-transcript sequence fixtures via
# `include_str!(".tmp_*.txt")` are gated behind the raw `cfg(dev_fixtures)`
# flag (see `[lints.rust]` below), not a Cargo feature. The raw cfg flag is
# used deliberately so `--all-features` (e.g. the project's
# `cargo clippy --all-targets --all-features` pre-commit) does NOT enable it:
# the `.tmp_*` files are regenerated on demand by a local VEP-cache export
# script and are intentionally not checked in.
#
# To run them, regenerate the fixtures locally and pass the cfg through
# RUSTFLAGS:
#   RUSTFLAGS="--cfg dev_fixtures" \
#     cargo test -p datafusion-bio-function-vep --features cache-builder --lib

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dev_fixtures)'] }
