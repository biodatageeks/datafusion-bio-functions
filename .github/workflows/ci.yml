name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.94.0'
          components: 'clippy, rustfmt'

      # `--all-features` enables `lance-cache`, whose `lance-index` dependency
      # builds `prost`, which requires the protobuf compiler at build time.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Avoid caching target: restored build artifacts can exhaust runner disk.
      - name: Cache Cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run tests
        run: cargo test --all

      # `cache-builder` is not a default feature, so `cargo test --all` compiles
      # neither `cache::build` nor its tests. The cache-conversion path needs its
      # own step or its regressions ship unnoticed.
      - name: Run cache-builder tests
        run: cargo test -p datafusion-bio-function-vep --features cache-builder --lib cache::build
